# @package _global_
defaults:
  - override /hydra/launcher: submitit_slurm
# Set account/partition for your cluster via CLI overrides.
hydra:
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    cpus_per_task: 2
    mem_gb: 4
    timeout_min: 60
    tasks_per_node: 1
    array_parallelism: 2
